<!doctype html><meta charset="utf-8"><title>sampler</title>
<style>body{margin:0;background:#0b0b0e}canvas{display:block}</style>
<canvas id="c" width="1440" height="900"></canvas>
<script>
// Turns CHIRON's turntable frames into dot keyframes: importance-sample edges + highlights,
// then chain the keyframes with sliced optimal transport so dot i moves the shortest way from frame to frame.
const N = 6000, FRAMES = (new URLSearchParams(location.search).get('f') || '0,2,4,6,8,10').split(',').map(Number), SCALE = 2.6 / 1600, CX = 800, CY = 470;
const P = new URLSearchParams(location.search);
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const R = rng(11);
function load(src) { return new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = src; }); }
function score(img) {
  const W = 800, H = 450, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, W, H);
  const d = x.getImageData(0, 0, W, H).data, L = new Float32Array(W * H), V = new Float32Array(W * H);
  // edges from luminance; highlights from the brightest channel, so the red tail light bar counts
  for (let i = 0; i < W * H; i++) { L[i] = (0.2126 * d[i*4] + 0.7152 * d[i*4+1] + 0.0722 * d[i*4+2]) / 255; V[i] = Math.max(L[i], 0.85 * d[i*4] / 255 * (d[i*4] > 1.6 * d[i*4+1] ? 1 : 0)); }
  const B = new Float32Array(W * H);   // 3x3 blur
  for (let y = 1; y < H - 1; y++) for (let xx = 1; xx < W - 1; xx++) { let s = 0; for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) s += L[(y + j) * W + xx + i]; B[y * W + xx] = s / 9; }
  const Sc = new Float32Array(W * H);
  const ew = +(P.get('ew') || 3.2), lw = +(P.get('lw') || 1.6), lt = +(P.get('lt') || 0.2);
  for (let y = 1; y < H - 1; y++) for (let xx = 1; xx < W - 1; xx++) {
    const g = k => B[k];
    const i = y * W + xx;
    const gx = g(i - W + 1) + 2 * g(i + 1) + g(i + W + 1) - g(i - W - 1) - 2 * g(i - 1) - g(i + W - 1);
    const gy = g(i + W - 1) + 2 * g(i + W) + g(i + W + 1) - g(i - W - 1) - 2 * g(i - W) - g(i - W + 1);
    const e = Math.hypot(gx, gy), hl = Math.max(0, V[i] - lt);
    let s = ew * Math.pow(e, +(P.get("ex") || 1.1)) + lw * Math.pow(hl, 1.4);
    // keep the car and the podium rim: soft box mask (in 1600x900 pixels), the podium face below the wheels weakened
    const X = xx * 2, Y = y * 2, f = (v, lo, hi, k) => Math.min(1, Math.max(0, (v - lo) / k)) * Math.min(1, Math.max(0, (hi - v) / k));
    s *= f(X, 110, 1500, 40) * f(Y, 230, 730, 30) * (Y > 655 ? +(P.get('pod') || 0.3) : 1);
    if (xx < 4 || y < 4 || xx > W - 5 || y > H - 5) s = 0;
    if (s < +(P.get('th') || 0.06)) s = 0;
    Sc[i] = s;
  }
  return { Sc, W, H };
}
function sample({ Sc, W, H }) {
  const cdf = new Float64Array(W * H); let t = 0; for (let i = 0; i < W * H; i++) { t += Sc[i]; cdf[i] = t; }
  const pts = new Float32Array(N * 2);
  for (let n = 0; n < N; n++) {
    const r = R() * t; let lo = 0, hi = W * H - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (cdf[m] < r) lo = m + 1; else hi = m; }
    const px = (lo % W + R()) * 2, py = (Math.floor(lo / W) + R()) * 2;   // back to 1600x900 pixels
    pts[n*2] = (px - CX) * SCALE; pts[n*2+1] = -(py - CY) * SCALE;
  }
  return pts;
}
// sliced optimal transport: move A's dots until they are distributed like B, keeping each dot's identity
function slicedOT(A, B, iters) {
  const a = Float32Array.from(A), pa = new Float32Array(N), pb = new Float32Array(N), ia = new Uint32Array(N), ib = new Uint32Array(N);
  for (let it = 0; it < iters; it++) {
    const th = R() * Math.PI, dx = Math.cos(th), dy = Math.sin(th);
    for (let i = 0; i < N; i++) { pa[i] = a[i*2] * dx + a[i*2+1] * dy; pb[i] = B[i*2] * dx + B[i*2+1] * dy; ia[i] = i; ib[i] = i; }
    ia.sort((p, q) => pa[p] - pa[q]); ib.sort((p, q) => pb[p] - pb[q]);
    for (let k = 0; k < N; k++) { const i = ia[k], m = pb[ib[k]] - pa[i]; a[i*2] += m * dx; a[i*2+1] += m * dy; }
  }
  return a;
}
async function main() {
  const imgs = await Promise.all(FRAMES.map(f => load('frames/src_' + String(f).padStart(2, '0') + '.webp')));
  const samples = imgs.map(im => sample(score(im)));
  const kf = [samples[0]];
  for (let k = 1; k < samples.length; k++) kf.push(slicedOT(kf[k - 1], samples[k], +(P.get('it') || 160)));
  window.__kf = kf;
  // preview: keyframes 0, 2, 5 and the half-way blend between 0 and 1
  const c = document.getElementById('c'), ctx = c.getContext('2d'); ctx.fillStyle = '#0b0b0e'; ctx.fillRect(0, 0, 1440, 900);
  const blend = (A, B, t) => A.map((v, i) => v + (B[i] - v) * t);
  const L = kf.length - 1, views = [kf[0], blend(kf[1], kf[2], 0.5), kf[Math.round(L * 0.6)], kf[L]];
  views.forEach((v, k) => {
    const ox = (k % 2) * 720 + 360, oy = Math.floor(k / 2) * 450 + 225, s = 720 / 2.9;
    ctx.fillStyle = 'rgba(255,122,61,.9)';
    for (let i = 0; i < N; i++) { ctx.beginPath(); ctx.arc(ox + v[i*2] * s, oy - v[i*2+1] * s, 0.9 + (i % 7) / 6 * 0.6, 0, 6.283); ctx.fill(); }
  });
  // export: Int16, x/y per dot per keyframe, 1/8000 units
  const q = new Int16Array(kf.length * N * 2); kf.forEach((k, j) => { for (let i = 0; i < N * 2; i++) q[j * N * 2 + i] = Math.round(k[i] * 8000); });
  let bin = ''; const u8 = new Uint8Array(q.buffer); for (let i = 0; i < u8.length; i++) bin += String.fromCharCode(u8[i]);
  window.__bin = btoa(bin);
  document.title = 'done';
}
main().catch(e => { document.title = 'error ' + e; console.error(e); });
</script>
